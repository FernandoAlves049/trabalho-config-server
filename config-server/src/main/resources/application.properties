spring.application.name=config-server
server.port=8888
server.address=127.0.0.1

# Defina CONFIG_GIT_URI com a URL do seu repositorio remoto no GitHub.
spring.cloud.config.server.git.uri=${CONFIG_GIT_URI:https://github.com/FernandoAlves049/repo-configs.git}
spring.cloud.config.server.git.clone-on-start=true
spring.cloud.config.server.git.default-label=${CONFIG_GIT_LABEL:main}
spring.cloud.config.server.git.try-master-branch=false
spring.cloud.config.server.git.refresh-rate=0

management.endpoints.web.exposure.include=*
